name: Verify deployment

# Vercel's Git integration creates a GitHub deployment for every push and
# reports its status. When a deployment succeeds, this workflow smoke tests the
# live URL so a broken deploy is visible on the pull request, not just in the
# Vercel dashboard. Set VERCEL_AUTOMATION_BYPASS_SECRET in repository secrets
# if preview deployments use Vercel deployment protection.
on:
  deployment_status:
  # Manual fallback for when Vercel's Git integration does not post a
  # deployment status for a preview: run the same smoke test against a URL.
  workflow_dispatch:
    inputs:
      url:
        description: "Deployment URL to smoke test (a preview alias or the production domain)"
        required: true
        type: string
      ref:
        description: "Commit or branch the deployment was built from"
        required: true
        type: string
      production:
        description: "Treat the URL as production (expects indexable pages)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  smoke:
    name: Smoke test ${{ github.event.deployment.environment }}
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Production is checked on its public domain (repository variable PRODUCTION_URL) when one is set,
      # because a deployment's unique URL sits behind Vercel Authentication and needs the bypass secret.
      DEPLOY_URL: ${{ inputs.url || (github.event.deployment.environment == 'Production' && vars.PRODUCTION_URL) || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      IS_PRODUCTION: ${{ (github.event_name == 'workflow_dispatch' && inputs.production) || github.event.deployment.environment == 'Production' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.deployment.sha }}

      - name: The home page and the API answer
        run: |
          set -euo pipefail
          echo "Testing ${DEPLOY_URL}"
          auth=()
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            auth=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" --location --max-time 30 \
            "${auth[@]}" "${DEPLOY_URL}/")
          if [ "$status" = "401" ] && [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "::error::${DEPLOY_URL} is behind Vercel Authentication and the repository secret VERCEL_AUTOMATION_BYPASS_SECRET is not set. Create a Protection Bypass for Automation secret in the Vercel project and add it to GitHub (docs/LAUNCH_RUNBOOK.md, Vercel step 4); for production you can also set the repository variable PRODUCTION_URL to the public domain."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --location --max-time 30 --retry 3 --retry-all-errors \
            "${auth[@]}" "${DEPLOY_URL}/" | grep --fixed-strings --quiet "Tidefern"
          curl --fail-with-body --silent --show-error --location --max-time 30 --retry 3 --retry-all-errors \
            "${auth[@]}" "${DEPLOY_URL}/api/v1/health" | grep --fixed-strings --quiet '"status":"ok"'
          # The cross-site check on a mutation (architecture 8.3): no Origin is refused
          # outright; the deployment's own Origin passes the check and reaches the router,
          # which has no PUT on /v1/me and answers 404.
          no_origin=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 30 \
            "${auth[@]}" -X PUT "${DEPLOY_URL}/api/v1/me")
          own_origin=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 30 \
            "${auth[@]}" -X PUT -H "Origin: ${DEPLOY_URL}" "${DEPLOY_URL}/api/v1/me")
          test "$no_origin" = "403" || { echo "::error::PUT without Origin answered $no_origin, expected 403"; exit 1; }
          test "$own_origin" = "404" || { echo "::error::PUT with the deployment's Origin answered $own_origin, expected 404"; exit 1; }

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Browser smoke tests against the deployment
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.DEPLOY_URL }}
          EXPECT_INDEXABLE: ${{ env.IS_PRODUCTION == 'true' && 'true' || 'false' }}
        run: pnpm test:e2e --grep "@smoke"

      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-smoke-report
          path: apps/web/playwright-report
          retention-days: 7
