name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs, never a run on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  CI: true

jobs:
  verify:
    # The job name is the required status check in the main ruleset. Keep it exactly "verify".
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@v6

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Prose gate (no em dashes)
        run: pnpm prose:check

      - name: Skills gate (spec frontmatter, symlinks resolve)
        run: pnpm skills:check

      - name: Generated files are current (tokens, brand copies, OpenAPI)
        run: |
          pnpm tokens:check
          pnpm tokens:contrast
          pnpm --filter web brand:check
          pnpm openapi:check

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Browser tests against the production build
        run: pnpm test:e2e

      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
