name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs let an agent verify a branch before opening a pull request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs, never a run on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  CI: true

jobs:
  verify:
    # The job name is the required status check in the main ruleset. Keep it exactly "verify".
    name: verify
    runs-on: ubuntu-latest
    # The seeded browser suite runs one worker (the auth limiter allows three sign-ins per ten
    # seconds for the whole run) and grew to about 380 tests with J1 to J3; the job took 29 to
    # 31 minutes, so 30 cancelled green runs. Lower it again if the suite is sharded.
    timeout-minutes: 45
    services:
      postgres:
        # postgres 18.6, pinned to the digest of its multi-architecture index like the actions below
        # (resolved from Docker Hub on 2026-10-05). Pulled from the official-image mirror on Amazon
        # ECR Public, which serves the same index under the same digest (checked 2026-10-09):
        # anonymous Docker Hub pulls from shared runners met its rate limit (run 37991468945). The
        # browser suite signs in against seeded users on it (architecture 15 and 16.1); unit tests
        # keep using PGlite.
        image: public.ecr.aws/docker/library/postgres:18.6@sha256:6737476511d43c91c7cee9aa027b5d30458b7ed0f3af663ff8715c14ce4355b6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: tidefern
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname tidefern"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      pgbouncer:
        # PgBouncer 1.26.0 in transaction mode in front of the service above, the way Neon's -pooler
        # endpoint fronts production (architecture 7.2). edoburu/pgbouncer v1.26.0-p0, pinned to the
        # tag's digest as Docker Hub listed it on 2026-10-09. Only the pooled integration suite in
        # packages/db (task J9) connects through it; the build, the seed and the browser suite keep
        # using the database directly. It reaches Postgres by its service name and logs in as
        # tidefern_app with the same throwaway password as DATABASE_URL below; it connects lazily, so
        # it starts before the grant-login step gives the role LOGIN. Two server connections, so the
        # suite's four client connections have to share them.
        image: edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
        env:
          DATABASE_URL: postgresql://tidefern_app:ci-only-app-password@postgres:5432/tidefern
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
          DEFAULT_POOL_SIZE: "2"
        ports:
          - 6432:5432
    env:
      # Test-only values for the seeded browser suite. None of them is a secret and none exists
      # anywhere outside this job: the database lives in the service container above and is gone
      # with the job, and CI never holds a real credential (architecture 16.1). Every variable here
      # is listed in turbo.json globalEnv so the build hash keys on it. The owner URL (the service's
      # postgres superuser) is not job env: it sits on the four database steps that need it and on
      # the seeded server's step, for the job runner, and on nothing else, so the build, the unit
      # tests and the database-free server never see it.
      #
      # Migration 0000 creates tidefern_app NOLOGIN; the grant-login step below gives it LOGIN with
      # this throwaway password, then next build and next start connect as it (architecture 7.2).
      DATABASE_URL: postgresql://tidefern_app:ci-only-app-password@127.0.0.1:5432/tidefern
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef-not-real
      # Where the seeded server listens; Better Auth trusts this origin for sign-ins (packages/auth hosts.ts).
      BETTER_AUTH_URL: http://127.0.0.1:3000
      # A test-only KEK: base64 of the 32 ASCII bytes "tidefern-ci-only-kek-0123456789a". The seed
      # seals its free text under it and the server unwraps with it; nothing real was ever wrapped under it.
      TIDEFERN_KEK_V1: dGlkZWZlcm4tY2ktb25seS1rZWstMDEyMzQ1Njc4OWE=
      LOG_HMAC_SECRET: ci-only-log-hmac-secret-0123456789abcdef
      # The mail capture endpoint for verification links and the frozen "today" the seed and the
      # browser assertions share; both are refused on Vercel production (architecture 17.1).
      E2E_MAIL_CAPTURE: "true"
      TIDEFERN_FAKE_NOW: "2026-10-05"
      BETTER_AUTH_TELEMETRY: "0"
      # CRON_SECRET is not job env: it sits on the seeded server's step and on the browser suite's,
      # which calls the job runner with it. Everywhere else it is unset, and the runner answers 404.
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history on pull requests so the commit-message gate and future contract diffs can see the base.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Prose gate (no em dashes)
        run: pnpm prose:check

      - name: Skills gate (spec frontmatter, symlinks resolve)
        run: pnpm skills:check

      - name: Stylesheet rules (no transition all, no raw color or removed outline in a module)
        run: pnpm css:check

      - name: Commit messages carry no em dash (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git log --format=%B "origin/${{ github.base_ref }}..HEAD" | node -e '
            let text = "";
            process.stdin.on("data", (chunk) => (text += chunk)).on("end", () => {
              if (text.includes(String.fromCharCode(0x2014))) {
                console.error("A commit message in this pull request contains an em dash.");
                process.exit(1);
              }
              console.log("commit messages passed");
            });'

      - name: Generated files are current (tokens, brand copies, OpenAPI, client types, growth data)
        run: |
          pnpm tokens:check
          pnpm tokens:contrast
          pnpm --filter web brand:check
          pnpm openapi:check
          pnpm client:check
          pnpm growth:check

      - name: Formatting
        run: pnpm format:check

      # The contract drift gate of architecture 5.1 and 16.1: an error-level change in
      # openapi/v1.json (a removed required field, a retyped field, a new required parameter or a
      # dropped path) fails the pull request, because installed clients keep calling v1 for months.
      # Removing an optional response field is info level in oasdiff and passes; whether it should
      # fail is a 16.1 decision, not this step's. The base copy goes under node_modules/.cache,
      # which no later step formats, lints or builds. The commit-message step above already
      # fetched the base branch.
      - name: Read the base branch's contract (pull requests)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p node_modules/.cache/oasdiff
          git show "origin/$BASE_REF:openapi/v1.json" > node_modules/.cache/oasdiff/base-v1.json

      # The oasdiff release binary, checked against a pinned SHA-256, rather than
      # oasdiff/oasdiff-action, whose container is built from tufin/oasdiff on Docker Hub: anonymous
      # pulls from shared runners met 429 Too Many Requests on three attempts in a row (run
      # 37990905516), which failed verify without a change to the contract. The same release
      # (1.33.0, the image the action used) and the same inputs: fail-on ERR fails the job on any
      # error-level change except one the lead approved in openapi/BREAKING.md (err-ignore: a dated
      # line per change, with its reason). Nothing is uploaded and no comment is posted; the result
      # is in the step log and as annotations on the changed lines.
      - name: No breaking change to the v1 contract (pull requests)
        if: github.event_name == 'pull_request'
        env:
          OASDIFF_VERSION: 1.33.0
          # sha256 of oasdiff_1.33.0_linux_amd64.tar.gz, matching the release's checksums.txt (2026-10-09).
          OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
        run: |
          dir="$RUNNER_TEMP/oasdiff"
          mkdir -p "$dir"
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$dir/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${archive}"
          echo "${OASDIFF_SHA256}  $dir/$archive" | sha256sum --check --strict
          tar -xzf "$dir/$archive" -C "$dir" oasdiff
          "$dir/oasdiff" breaking node_modules/.cache/oasdiff/base-v1.json openapi/v1.json \
            --fail-on ERR --err-ignore openapi/BREAKING.md --format githubactions

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The service's postgres superuser is the owner role in CI: it runs the migrations, the grant,
      # the pooled check's own rows and the seed. Its URL is written on these four steps only (the
      # same literal each time; the workflow has no way to name it once without making it job env).
      - name: Migrate the service database as its owner
        env:
          DATABASE_URL_UNPOOLED: postgresql://postgres:ci-only-postgres-password@127.0.0.1:5432/tidefern
        run: pnpm db:migrate

      # psql is on the runner image, but the helper in packages/db is what runs here: it takes the
      # role and the password from DATABASE_URL itself, so the URL next start uses is the one that
      # was provisioned, and it connects back as tidefern_app to prove the login works and that the
      # role still cannot bypass row level security.
      - name: Let the app role log in with the throwaway password
        env:
          DATABASE_URL_UNPOOLED: postgresql://postgres:ci-only-postgres-password@127.0.0.1:5432/tidefern
        run: pnpm db:grant-login

      # Architecture 15's pooled check (task J9): two actors at once through the PgBouncer service in
      # transaction mode, as tidefern_app with NODE_ENV=production, proving each sees only its own
      # rows and that SET LOCAL ROLE and the actor setting reset after every transaction, a failed
      # one included. DATABASE_URL here is the pooled URL; the owner URL creates and removes the
      # suite's own synthetic rows before the seed runs. About a second of tests; the pooler image
      # pull adds a few seconds to the job's container setup.
      - name: Pooled database check through PgBouncer in transaction mode
        env:
          DATABASE_URL: postgresql://tidefern_app:ci-only-app-password@127.0.0.1:6432/tidefern
          DATABASE_URL_UNPOOLED: postgresql://postgres:ci-only-postgres-password@127.0.0.1:5432/tidefern
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready --host 127.0.0.1 --port 6432 --username tidefern_app --dbname tidefern > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          pnpm --filter @tidefern/db test:integration

      # The seed runs through withSystem(), which the app role is refused for, so DATABASE_URL is the
      # owner URL on this step.
      - name: Seed the synthetic cast as the owner at the frozen date
        env:
          DATABASE_URL: postgresql://postgres:ci-only-postgres-password@127.0.0.1:5432/tidefern
        run: pnpm db:seed

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Every variable the server needs is listed here, so what the browser suite runs against is
      # readable in one place (a step's env adds to the job's, it does not replace it; the job env
      # carries the same values). The server is started once in a session of its own, outside
      # Playwright's webServer (PLAYWRIGHT_BASE_URL turns that off); the saved pid leads its
      # process group, which is what the stop step kills, next-server child included.
      #
      # The last three give this server the job runner (architecture 10.1 and 11), so the deletion
      # flow proves removal and not just the lock (task J3d): the owner URL, the same literal as the
      # database steps, is the runner's connection (the host builds its one-connection owner pool
      # only when DATABASE_URL_UNPOOLED is set); CRON_SECRET is a test-only bearer the browser suite
      # sends to /api/internal/jobs/run; OWNER_EMAIL is a test-only inbox the closure's processor
      # notice goes to, which the capture mailer keeps. Without them a closure past its window
      # waits and deletes nothing. None of the three is a secret: the database dies with the job.
      # E2E_JOBS_SCHEDULED_ONLY turns off the inline drain on this server alone (never on Vercel),
      # so a close waits for the scheduled run: the specs see the deleting view in a stable state,
      # and the deletion flow then runs the job itself instead of racing one already in flight.
      - name: Start the production server against the seeded database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ env.BETTER_AUTH_URL }}
          TIDEFERN_KEK_V1: ${{ env.TIDEFERN_KEK_V1 }}
          LOG_HMAC_SECRET: ${{ env.LOG_HMAC_SECRET }}
          E2E_MAIL_CAPTURE: ${{ env.E2E_MAIL_CAPTURE }}
          TIDEFERN_FAKE_NOW: ${{ env.TIDEFERN_FAKE_NOW }}
          BETTER_AUTH_TELEMETRY: ${{ env.BETTER_AUTH_TELEMETRY }}
          DATABASE_URL_UNPOOLED: postgresql://postgres:ci-only-postgres-password@127.0.0.1:5432/tidefern
          CRON_SECRET: ci-only-cron-secret-0123456789abcdef-not-real
          OWNER_EMAIL: owner@example.test
          E2E_JOBS_SCHEDULED_ONLY: "true"
        run: |
          cd apps/web
          setsid nohup node_modules/.bin/next start --port 3000 --hostname 127.0.0.1 > "$RUNNER_TEMP/next-seeded.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/next-seeded.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 5 http://127.0.0.1:3000/api/v1/health > /dev/null; then
              echo "server answered after $attempt attempts"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the production server did not answer on port 3000"
          cat "$RUNNER_TEMP/next-seeded.log"
          exit 1

      # CRON_SECRET is the server step's literal: the deletion flow runs the due jobs with it
      # (apps/web/tests/e2e/jobs.ts).
      - name: Browser tests against the seeded production server
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          CRON_SECRET: ci-only-cron-secret-0123456789abcdef-not-real
        run: pnpm test:e2e

      # The byte-budget gate of docs/design/PERFORMANCE.md: each key route loaded once in a fresh
      # Chromium context with Lighthouse's mobile screen, its compressed script transfer and its
      # total transfer summed from the network events, and the run fails on any route over its
      # ceiling in apps/web/scripts/perf/budgets.json. Bytes only, never timings, so it does not
      # flap; it reuses the browser the suite installed and the server the suite ran against. Like
      # the smoke subset below it is an independent assertion, so it runs even when the suite
      # failed (the job still fails); only a cancellation skips it.
      - name: Byte budgets for the key routes against the seeded server
        if: ${{ !cancelled() }}
        run: pnpm --filter web perf:bytes http://127.0.0.1:3000

      # The smoke subset also runs against production deployments, which have no seeded users and
      # no test database, so it must pass against a server that has no database at all. This second
      # server is started with both database variables removed from its environment (the owner URL
      # is on no step here anyway; the unset keeps the proof true if that ever changes); the smoke
      # rule in apps/web/tests/e2e/smoke-rule.ts is what keeps the tagged tests from authenticating.
      # The two browser assertions are independent, so this one runs even when the full suite
      # failed (the job still fails); only a cancellation skips it.
      - name: Start a second server with no database
        id: database_free
        if: ${{ !cancelled() }}
        env:
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://127.0.0.1:3001
          TIDEFERN_KEK_V1: ${{ env.TIDEFERN_KEK_V1 }}
          LOG_HMAC_SECRET: ${{ env.LOG_HMAC_SECRET }}
          E2E_MAIL_CAPTURE: ${{ env.E2E_MAIL_CAPTURE }}
          TIDEFERN_FAKE_NOW: ${{ env.TIDEFERN_FAKE_NOW }}
          BETTER_AUTH_TELEMETRY: ${{ env.BETTER_AUTH_TELEMETRY }}
        run: |
          cd apps/web
          env --unset=DATABASE_URL --unset=DATABASE_URL_UNPOOLED \
            setsid nohup node_modules/.bin/next start --port 3001 --hostname 127.0.0.1 > "$RUNNER_TEMP/next-database-free.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/next-database-free.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 5 http://127.0.0.1:3001/api/v1/health > /dev/null; then
              echo "server answered after $attempt attempts"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the database-free server did not answer on port 3001"
          cat "$RUNNER_TEMP/next-database-free.log"
          exit 1

      # The html reporter empties its folder on every run, so this run writes inside the full
      # suite's folder rather than over it: a failure's traces from the step above survive, and the
      # one artifact below holds both reports (index.html and smoke/index.html).
      - name: The smoke subset passes with DATABASE_URL unset
        if: ${{ !cancelled() && steps.database_free.outcome == 'success' }}
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/smoke
        run: pnpm test:e2e --grep "@smoke"

      # Each saved pid is the leader of the session setsid opened for it, so its negative names the
      # whole process group: the next CLI and the next-server child it spawned.
      - name: Stop both servers
        if: always()
        run: |
          for name in seeded database-free; do
            pidfile="$RUNNER_TEMP/next-$name.pid"
            if [ -f "$pidfile" ]; then
              kill -- -"$(cat "$pidfile")" 2>/dev/null || true
            fi
          done

      - name: Keep the Playwright reports when something fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
